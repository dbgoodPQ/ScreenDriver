; ScreenDriver coprocessor firmware: Seeed XIAO ESP32-C6 driving an ILI9341.
; Uses the pioarduino platform because the C6 needs Arduino core 3.x.
; Build and flash from PowerShell, not Git Bash: the platform refuses MSYS shells.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
build_flags =
    -I$PROJECT_DIR/../shared
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Coprocessor firmware. Panel SPI at 80 MHz (verified clean on this module).
[env:xiao_c6]
build_src_filter = +<*>
build_flags =
    ${env.build_flags}
    -DPANEL_SPI_HZ=80000000

; Fallback: same firmware with the link at 2 Mbaud (the Cardputer must run link_test_2m)
[env:xiao_c6_2m]
build_src_filter = +<*>
build_flags =
    ${env.build_flags}
    -DPANEL_SPI_HZ=80000000
    -DSD_LINK_BAUD=2000000

; Same firmware at 40 MHz, as a fallback for other panel modules
[env:xiao_c6_40mhz]
build_src_filter = +<*>
build_flags =
    ${env.build_flags}
    -DPANEL_SPI_HZ=40000000

; Rendering self-test: logs C6 render timings to USB every 5 s (no Cardputer needed)
[env:selftest]
build_src_filter = +<*>
build_flags =
    ${env.build_flags}
    -DPANEL_SPI_HZ=80000000
    -DSD_SELFTEST

