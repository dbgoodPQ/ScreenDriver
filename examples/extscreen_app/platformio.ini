; Example: an existing, separate Cardputer app that adds the ScreenDriver external screen.
; Build and flash from PowerShell (pioarduino refuses Git Bash):
;   cd examples/extscreen_app
;   pio run
;   copy .pio\build\extscreen_app\firmware.bin E:\firmwares\screendriver-extscreen-example.bin
; Never flash the Cardputer over USB (it would overwrite the launcher): start the app from the SD card.

[env:extscreen_app]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
lib_deps =
    m5stack/M5Unified
    m5stack/M5Cardputer
    ; The two ScreenDriver lines. Paths are relative to this folder; an app outside the repo uses the absolute
    ; paths instead, e.g. symlink://C:/workspaces/ScreenDriver/cardputer/lib/RemoteDisplay
    ; (lib_extern_dirs does not work with current PlatformIO).
    symlink://../../cardputer/lib/RemoteDisplay
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; and e.g. -IC:/workspaces/ScreenDriver/shared outside the repo
    -I$PROJECT_DIR/../../shared
