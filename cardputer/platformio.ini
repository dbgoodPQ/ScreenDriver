; ScreenDriver host side: M5Stack Cardputer-ADV (Stamp-S3A, ESP32-S3FN8).
; Build and flash from PowerShell, not Git Bash.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified
build_flags =
    -I$PROJECT_DIR/../shared
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Milestone 2: link test (HELLO, ping, throughput, flow control, error recovery)
[env:link_test]
build_src_filter = +<link_test.cpp>

; Fallback: link test at 2 Mbaud (the C6 must run xiao_c6_2m)
[env:link_test_2m]
build_src_filter = +<link_test.cpp>
build_flags =
    ${env.build_flags}
    -DSD_LINK_BAUD=2000000

; ---- Milestone 3 examples (RemoteDisplay). The keyboard needs the M5Cardputer library.
[m3]
lib_deps =
    ${env.lib_deps}
    m5stack/M5Cardputer@^1.1.1

[env:draw_test]
build_src_filter = +<draw_test.cpp>
lib_deps = ${m3.lib_deps}

[env:hello_text]
build_src_filter = +<hello_text.cpp>
lib_deps = ${m3.lib_deps}

[env:ui_demo]
build_src_filter = +<ui_demo.cpp>
lib_deps = ${m3.lib_deps}

[env:render_bench]
build_src_filter = +<render_bench.cpp>
lib_deps = ${m3.lib_deps}

; ---- Milestone 4: sprites from the SD card (copy tools/make_sample_art.py output to /screendriver/)
[env:sprite_demo]
build_src_filter = +<sprite_demo.cpp>
lib_deps = ${m3.lib_deps}

; ---- Milestone 5: robustness (fuzz, unplug, reboot, corruption, watchdog, long run)
[env:stress_test]
build_src_filter = +<stress_test.cpp>
lib_deps = ${m3.lib_deps}

; ---- Milestone 6: tilemap + palette images + sprite batches (needs /screendriver/tiles.png, coin.png, slime.png)
[env:tilemap_demo]
build_src_filter = +<tilemap_demo.cpp>
lib_deps = ${m3.lib_deps}
